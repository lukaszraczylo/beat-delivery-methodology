<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Primary Meta Tags -->
    <title>Home — BEAT Manifesto</title>
    <meta name="description" content="The BEAT manifesto: a software delivery method for balanced, empowered, async teams. Deep work, written decisions, individual autonomy and a sustainable pace." />
    <meta name="author" content="Lukasz Raczylo" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BEAT Manifesto" />
    <meta property="og:description" content="A software delivery method for balanced, empowered, async teams." />
    <meta property="og:site_name" content="BEAT Manifesto" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BEAT Manifesto" />
    <meta property="twitter:description" content="A software delivery method for balanced, empowered, async teams." />

    <!-- Theme initialization (prevents flash) -->
    <script>
      (function() {
        var stored = null;
        try { stored = window.localStorage.getItem('beat-theme'); } catch (e) { stored = null; }
        var systemDark = false;
        try { systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { systemDark = false; }
        var dark = stored === 'dark' || (stored !== 'light' && systemDark);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="bg-background font-sans text-body-base text-body antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- No-JS fallback -->
    <noscript>
      <div class="mx-auto max-w-prose px-4 py-10">
        <h1 class="text-heading font-semibold text-large">JavaScript is required</h1>
        <p class="mt-3 text-body-base text-body">
          This site needs JavaScript to show the manifesto. Enable JavaScript in your browser and reload the page.
        </p>
      </div>
    </noscript>
  </body>
</html>
